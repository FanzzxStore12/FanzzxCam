<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Detection - Fanzzx</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #000;
            font-family: monospace;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Video di-mirror hanya untuk tampilan, TIDAK mempengaruhi deteksi */
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Canvas TIDAK di-mirror — koordinat X dibalik manual di JS */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }

        #fps {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #00ff88;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #00ff8840;
            z-index: 10;
        }

        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            min-width: 220px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        #finger-count {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #fff;
            font-size: 56px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 80px;
            text-align: center;
            z-index: 10;
        }

        #loading {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #fff;
            gap: 16px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loading p { font-size: 15px; color: #aaa; }
        #loading h2 { font-size: 22px; color: #00ff88; }

        #error-box {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a0000;
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 24px 32px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 200;
            max-width: 360px;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>
<body>
<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="fps">FPS: --</div>
    <div id="finger-count">0</div>
    <div id="status">Memuat model...</div>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Hand Detection</h2>
        <p id="load-msg">Memuat TensorFlow...</p>
    </div>

    <div id="error-box"></div>
</div>

<script>
    const messages = {
        1: "Halo saya",
        2: "Fanzzx pengembang",
        3: "Tools python",
        4: "Ini salam kenal",
        5: "Semuanya"
    };

    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const fpsEl    = document.getElementById('fps');
    const statusEl = document.getElementById('status');
    const countEl  = document.getElementById('finger-count');
    const loadEl   = document.getElementById('loading');
    const loadMsg  = document.getElementById('load-msg');
    const errorBox = document.getElementById('error-box');

    let lastSpeakTime = {};
    let frameCount = 0;
    let lastTime = Date.now();

    function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = '<b>Error</b><br><br>' + msg;
        loadEl.style.display = 'none';
    }

    async function startCamera() {
        loadMsg.textContent = 'Mengakses kamera...';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                audio: false
            });
            video.srcObject = stream;
            await new Promise((resolve, reject) => {
                video.onloadedmetadata = resolve;
                video.onerror = reject;
                setTimeout(reject, 10000);
            });
            await video.play();
            canvas.width  = video.videoWidth  || 1280;
            canvas.height = video.videoHeight || 720;
        } catch (err) {
            if (err.name === 'NotAllowedError') {
                showError('Izin kamera ditolak.<br>Buka Settings - Site Settings - Camera dan izinkan halaman ini.');
            } else if (err.name === 'NotFoundError') {
                showError('Webcam tidak ditemukan.<br>Pastikan webcam sudah terhubung.');
            } else {
                showError('Gagal mengakses kamera: ' + err.message);
            }
            throw err;
        }
    }

    /*
     * Hitung jari terangkat.
     * Model dipanggil dengan flipHorizontal: true, jadi koordinat sudah sesuai tampilan mirror.
     * Thumb: deteksi arah horizontal berdasarkan posisi wrist vs index_mcp.
     * 4 jari: tip.y < pip.y = terangkat.
     */
    function countRaisedFingers(hand) {
        const lm = hand.keypoints;
        const kp = {};
        lm.forEach(p => { kp[p.name] = p; });

        let count = 0;

        // Thumb
        const thumbTip = kp['thumb_tip'];
        const thumbIp  = kp['thumb_ip'];
        const wrist    = kp['wrist'];
        const indexMcp = kp['index_finger_mcp'];
        if (thumbTip && thumbIp && wrist && indexMcp) {
            // Setelah flip, tangan kanan: wrist.x > indexMcp.x
            const isRightHand = wrist.x > indexMcp.x;
            if (isRightHand) {
                if (thumbTip.x > thumbIp.x) count++;
            } else {
                if (thumbTip.x < thumbIp.x) count++;
            }
        }

        // Index, Middle, Ring, Pinky
        [
            ['index_finger_tip',  'index_finger_pip'],
            ['middle_finger_tip', 'middle_finger_pip'],
            ['ring_finger_tip',   'ring_finger_pip'],
            ['pinky_finger_tip',  'pinky_finger_pip'],
        ].forEach(([tip, pip]) => {
            const t = kp[tip], p = kp[pip];
            if (t && p && t.y < p.y) count++;
        });

        return count;
    }

    /*
     * Gambar skeleton di canvas.
     * Video di-mirror via CSS (scaleX(-1)), tapi canvas tidak.
     * Karena model dipanggil flipHorizontal:true, koordinat sudah di-flip.
     * Kita tinggal gambar apa adanya — skeleton akan sejajar dengan video.
     */
    function drawHand(hand) {
        const lm = hand.keypoints;
        const scaleX = canvas.width  / video.videoWidth;
        const scaleY = canvas.height / video.videoHeight;

        const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],
            [5,9],[9,13],[13,17]
        ];

        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        connections.forEach(([a, b]) => {
            const pa = lm[a], pb = lm[b];
            if (!pa || !pb) return;
            ctx.beginPath();
            ctx.moveTo(pa.x * scaleX, pa.y * scaleY);
            ctx.lineTo(pb.x * scaleX, pb.y * scaleY);
            ctx.stroke();
        });

        lm.forEach(pt => {
            ctx.beginPath();
            ctx.arc(pt.x * scaleX, pt.y * scaleY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        });
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        window.speechSynthesis.speak(u);
    }

    async function main() {
        await startCamera();

        loadMsg.textContent = 'Memuat model deteksi tangan...';

        let detector;
        try {
            detector = await handPoseDetection.createDetector(
                handPoseDetection.SupportedModels.MediaPipeHands,
                { runtime: 'tfjs', modelType: 'full', maxHands: 2 }
            );
        } catch (err) {
            showError('Gagal memuat model: ' + err.message);
            throw err;
        }

        loadEl.style.display = 'none';
        statusEl.textContent = 'Siap! Tunjukkan tangan ke kamera';

        async function detect() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let hands = [];
            try {
                // flipHorizontal: true supaya koordinat sesuai tampilan mirror di video
                hands = await detector.estimateHands(video, { flipHorizontal: true });
            } catch (e) { /* lewati frame */ }

            if (hands.length > 0) {
                hands.forEach(hand => drawHand(hand));

                const count = countRaisedFingers(hands[0]);
                countEl.textContent = count;

                if (count >= 1 && count <= 5) {
                    const now = Date.now();
                    if (!lastSpeakTime[count] || now - lastSpeakTime[count] > 2000) {
                        speak(messages[count]);
                        lastSpeakTime[count] = now;
                        statusEl.textContent = count + ' jari - ' + messages[count];
                    }
                } else {
                    statusEl.textContent = 'Tangan terdeteksi';
                }
            } else {
                countEl.textContent = '0';
                statusEl.textContent = 'Tunjukkan tangan ke kamera';
            }

            // FPS
            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                fpsEl.textContent = 'FPS: ' + Math.round(frameCount * 1000 / (now - lastTime));
                frameCount = 0;
                lastTime = now;
            }

            requestAnimationFrame(detect);
        }

        detect();
    }

    main().catch(err => console.error('Fatal:', err));
</script>
</body>
</html>
