<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Detection - Fanzzx</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: monospace; }

        #container { position: relative; width: 100vw; height: 100vh; }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Canvas overlay, ukuran sama dengan video element */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Tidak di-mirror — koordinat dibalik manual */
        }

        #fps {
            position: absolute;
            top: 16px; left: 16px;
            color: #00ff88; font-size: 14px;
            background: rgba(0,0,0,0.55);
            padding: 4px 10px; border-radius: 6px;
            z-index: 10;
        }

        #finger-count {
            position: absolute;
            top: 16px; right: 16px;
            color: #fff; font-size: 56px; font-weight: bold;
            background: rgba(0,0,0,0.55);
            padding: 8px 20px; border-radius: 12px;
            min-width: 80px; text-align: center;
            z-index: 10;
        }

        #status {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 16px;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px; border-radius: 30px;
            text-align: center; min-width: 220px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; color: #fff; gap: 16px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading h2 { font-size: 22px; color: #00ff88; }
        #loading p  { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="fps">FPS: --</div>
    <div id="finger-count">0</div>
    <div id="status">Memuat model...</div>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Hand Detection</h2>
        <p id="load-msg">Memuat TensorFlow...</p>
    </div>
</div>

<script>
const messages = {
    1: "Halo saya",
    2: "Fanzzx pengembang",
    3: "Tools python",
    4: "Ini salam kenal",
    5: "Semuanya"
};

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const fpsEl    = document.getElementById('fps');
const statusEl = document.getElementById('status');
const countEl  = document.getElementById('finger-count');
const loadEl   = document.getElementById('loading');
const loadMsg  = document.getElementById('load-msg');

let lastSpeakTime = {};
let frameCount = 0;
let lastFpsTime = Date.now();

// ── Kamera ──────────────────────────────────────────────
async function startCamera() {
    loadMsg.textContent = 'Mengakses kamera...';

    // Coba kamera depan dulu, fallback ke kamera manapun
    let stream;
    const constraints = [
        { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: true, audio: false }
    ];

    for (const c of constraints) {
        try {
            stream = await navigator.mediaDevices.getUserMedia(c);
            break;
        } catch (e) {
            // Coba constraint berikutnya
        }
    }

    if (!stream) {
        // Tampilkan pesan langsung di layar tanpa error box
        loadEl.innerHTML = '<p style="color:#ff8888;padding:24px;text-align:center;line-height:2">' +
            'Kamera tidak bisa diakses.<br>' +
            'Pastikan izin kamera diberikan<br>' +
            'dan tidak dipakai aplikasi lain.</p>';
        throw new Error('No camera stream');
    }

    video.srcObject = stream;

    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });
    await video.play();

    // Tunggu sampai video benar-benar punya ukuran (penting di HP)
    await new Promise(resolve => {
        const check = () => {
            if (video.videoWidth > 0) resolve();
            else setTimeout(check, 50);
        };
        check();
    });

    // Set canvas internal resolution = resolusi asli video
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
}

// ── Hitung jari ─────────────────────────────────────────
function countRaisedFingers(hand) {
    const kp = {};
    hand.keypoints.forEach(p => { kp[p.name] = p; });

    let count = 0;

    // Thumb — deteksi arah tangan dari posisi wrist vs index_mcp
    const thumbTip = kp['thumb_tip'];
    const thumbIp  = kp['thumb_ip'];
    const wrist    = kp['wrist'];
    const idxMcp   = kp['index_finger_mcp'];
    if (thumbTip && thumbIp && wrist && idxMcp) {
        // Setelah flipHorizontal:true, tangan kanan: wrist.x > idxMcp.x
        const rightHand = wrist.x > idxMcp.x;
        if (rightHand ? thumbTip.x > thumbIp.x : thumbTip.x < thumbIp.x) count++;
    }

    // 4 jari: tip.y < pip.y = terangkat
    [
        ['index_finger_tip',  'index_finger_pip'],
        ['middle_finger_tip', 'middle_finger_pip'],
        ['ring_finger_tip',   'ring_finger_pip'],
        ['pinky_finger_tip',  'pinky_finger_pip'],
    ].forEach(([tip, pip]) => {
        const t = kp[tip], p = kp[pip];
        if (t && p && t.y < p.y) count++;
    });

    return count;
}

// ── Gambar skeleton ──────────────────────────────────────
// Video di-CSS mirror (scaleX -1). Canvas tidak di-mirror.
// Model dipanggil flipHorizontal:true → koordinat sudah sesuai tampilan mirror.
// Untuk skeleton sejajar video: flip X = canvasWidth - x
function drawHand(hand) {
    const lm = hand.keypoints;
    const W  = canvas.width;
    const H  = canvas.height;

    const x = pt => W - pt.x;   // flip horizontal
    const y = pt => pt.y;

    const conn = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
    ];

    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = Math.max(2, W / 400); // lebih tebal di HP
    conn.forEach(([a, b]) => {
        if (!lm[a] || !lm[b]) return;
        ctx.beginPath();
        ctx.moveTo(x(lm[a]), y(lm[a]));
        ctx.lineTo(x(lm[b]), y(lm[b]));
        ctx.stroke();
    });

    const r = Math.max(4, W / 200);
    lm.forEach(pt => {
        ctx.beginPath();
        ctx.arc(x(pt), y(pt), r, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    });
}

// ── TTS ─────────────────────────────────────────────────
function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    window.speechSynthesis.speak(u);
}

// ── Main ─────────────────────────────────────────────────
async function main() {
    await startCamera();

    loadMsg.textContent = 'Memuat model deteksi tangan...';

    const detector = await handPoseDetection.createDetector(
        handPoseDetection.SupportedModels.MediaPipeHands,
        { runtime: 'tfjs', modelType: 'lite', maxHands: 1 }
        // 'lite' jauh lebih cepat di HP, akurasi tetap cukup untuk 1-5 jari
    );

    loadEl.style.display = 'none';
    statusEl.textContent = 'Siap! Tunjukkan tangan ke kamera';

    let lastCount = -1;

    async function detect() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let hands = [];
        try {
            hands = await detector.estimateHands(video, { flipHorizontal: true });
        } catch (_) {}

        if (hands.length > 0) {
            drawHand(hands[0]);
            const count = countRaisedFingers(hands[0]);

            countEl.textContent = count;

            if (count >= 1 && count <= 5) {
                const now = Date.now();
                if (!lastSpeakTime[count] || now - lastSpeakTime[count] > 2000) {
                    speak(messages[count]);
                    lastSpeakTime[count] = now;
                    statusEl.textContent = count + ' jari - ' + messages[count];
                }
            } else if (count !== lastCount) {
                statusEl.textContent = 'Tangan terdeteksi';
            }
            lastCount = count;
        } else {
            countEl.textContent = '0';
            statusEl.textContent = 'Tunjukkan tangan ke kamera';
            lastCount = -1;
        }

        // FPS
        frameCount++;
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
            fpsEl.textContent = 'FPS: ' + Math.round(frameCount * 1000 / (now - lastFpsTime));
            frameCount = 0;
            lastFpsTime = now;
        }

        requestAnimationFrame(detect);
    }

    detect();
}

main().catch(err => console.error('Fatal:', err));
</script>
</body>
</html>
