<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ToolsForge AI Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        /* CSS Wajib untuk Tampilan Kamera Polos Full-Screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Hilangkan scrollbar */
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Video memenuhi layar, potong sedikit jika perlu */
            z-index: 1;
        }

        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2; /* Canvas (border) berada di atas video */
            pointer-events: none; /* Sentuhan menembus canvas ke video */
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: lime;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 1.2rem;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading-screen">Memuat Model AI...</div>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading-screen');
        const ctx = canvas.getContext('2d');
        let model;

        // FUNGSI 1: Mengunci Kamera Belakang & Menyesuaikan Resolusi
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" }, // Prioritas Kamera Belakang
                        width: { ideal: 1280 }, // Resolusi ideal
                        height: { ideal: 720 }
                    },
                    audio: false,
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve(video);
                    };
                });
            } catch (err) {
                loading.innerText = "Error: Kamera diblokir atau tidak support HTTPS.";
                console.error(err);
            }
        }

        // FUNGSI 2: Loop Deteksi Objek Real-Time
        async function detect() {
            // Jalankan deteksi model COCO-SSD pada frame video saat ini
            const predictions = await model.detect(video);
            
            // Bersihkan canvas dari border frame sebelumnya
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar setiap objek yang terdeteksi
            predictions.forEach(prediction => {
                // Skala koordinat model ke ukuran canvas aktual
                const [x, y, width, height] = prediction.bbox;
                const scorePercentage = Math.round(prediction.score * 100);

                // Warna Border (Hijau Lime)
                ctx.strokeStyle = "#00FF00";
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                // Teks Label & Latar Belakang Teks
                ctx.fillStyle = "#00FF00";
                ctx.font = "16px monospace";
                ctx.textBaseline = "top";
                
                const label = `${prediction.class} (${scorePercentage}%)`;
                const textWidth = ctx.measureText(label).width;
                
                ctx.fillRect(x, y - 20, textWidth + 10, 20); // BG Teks
                ctx.fillStyle = "black";
                ctx.fillText(label, x + 5, y - 18); // Teks Utama
            });

            // Minta browser menjalankan fungsi ini lagi secepatnya (real-time loop)
            requestAnimationFrame(detect);
        }

        // FUNGSI UTAMA: Inisialisasi
        async function main() {
            // Langsung akses kamera
            await setupCamera();
            
            // Sesuaikan ukuran internal canvas agar sama dengan video yang diterima
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Muat Model COCO-SSD (download awal sekitar 15MB)
            model = await cocoSsd.load();
            
            // Sembunyikan layar loading
            loading.style.display = 'none';
            
            // Mulai loop deteksi
            detect();
        }

        // Mulai aplikasi
        window.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
